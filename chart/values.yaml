images:
  gridStatic:
    repository: ghcr.io/njwgroeneveld/gridstatic-grid-static
    tag: latest
  connector:
    repository: ghcr.io/njwgroeneveld/gridstatic-connector
    tag: latest
  alerter:
    repository: ghcr.io/njwgroeneveld/gridstatic-telegram-alerter
    tag: latest
  pullPolicy: Always

# ── Secrets ──────────────────────────────────────────────────────────────────
# This chart contains no passwords and creates no Secrets. You create them
# yourself and put only their names here. The reason: Helm stores the values you
# install with in a Secret in your cluster (sh.helm.release.v1.<name>.v1), and
# `helm get values` prints them back. What is not in here cannot leak from there.
#
# See the README for the commands that create these Secrets.

hyperliquid:
  # true: every order goes to Hyperliquid's testnet. Leave it on until the grid
  # has run there to your satisfaction -- switching to mainnet means real money.
  testnet: true
  # REQUIRED. Name of a Secret with the keys `private_key` and `wallet_address`.
  # Use a testnet key while testnet is true. wallet_address is the subaccount to
  # trade on; leave it empty to trade on the key's own account.
  #
  # Give this stack an account of its own. The bot checks every round that the
  # position adds up to its own orders; a manual position or another bot on the
  # same coin puts the grid on hold.
  existingSecret: ""

telegram:
  # Off: no alerter pod is deployed, and alert calls fail silently.
  enabled: false
  # Required once enabled is true. Name of a Secret with `bot_token` and `chat_id`.
  existingSecret: ""

grid:
  strategyAllocationPct: 80
  # Basis for order sizing: every line gets startBalance x allocation / lines,
  # fixed -- it does not grow with profit. With 20 lines and 80% allocation, 1000
  # means $40 per line. Hyperliquid refuses orders under $10 (leverage counts),
  # and the bot refuses to start with a grid that would place them.
  startBalance: 1000
  # How often the bot reads the exchange and repairs the grid.
  roundIntervalSeconds: 30
  # How far back the bot looks at fills to find coin a cell has bought but not
  # sold yet. Longer than any outage you expect the bot to sit out.
  fillLookbackHours: 72
  # Your grids. Deliberately empty: Helm merges maps, so a default grid here
  # would quietly run next to the ones in your values file. The key is a
  # free-form label for logs and alerts. One grid per coin: the exchange keeps
  # one position per coin per account.
  #
  # coins:
  #   BTC-20:
  #     coin: BTC
  #     active: true
  #     allocationPct: 100
  #     upper: 83000
  #     lower: 75000
  #     numLines: 20
  #     leverage: 1
  #   NDX-20:
  #     coin: "xyz:XYZ100"      # HIP-3 market: "dex:NAME", quoted
  #     active: true
  #     allocationPct: 100
  #     upper: 32000
  #     lower: 29000
  #     numLines: 20
  #     leverage: 1
  coins: {}

scheduling:
  # Empty: the scheduler picks a node. The images are built for amd64 and arm64.
  nodeSelector: {}
  tolerations: []

resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 200m
