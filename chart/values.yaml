images:
  gridStatic:
    repository: ghcr.io/njwgroeneveld/gridstatic-grid-static
    tag: latest
  dal:
    repository: ghcr.io/njwgroeneveld/gridstatic-dal
    tag: latest
  connector:
    repository: ghcr.io/njwgroeneveld/gridstatic-connector
    tag: latest
  alerter:
    repository: ghcr.io/njwgroeneveld/gridstatic-telegram-alerter
    tag: latest
  pullPolicy: Always

# ── Secrets ──────────────────────────────────────────────────────────────────
# This chart contains no passwords and creates no Secrets. You create them
# yourself and put only their names here. The reason: Helm stores the values you
# install with in a Secret in your cluster (sh.helm.release.v1.<name>.v1), and
# `helm get values` prints them back. What is not in here cannot leak from there.
#
# See the README for the commands that create these Secrets.

database:
  # REQUIRED. Name of a Secret with the key `url`: the connection string to your
  # own Supabase project or any other PostgreSQL.
  #
  # Which connection: in the Supabase dashboard under "Connect", take the SESSION
  # POOLER (port 5432, host aws-0-<region>.pooler.supabase.com, user
  # postgres.<project-ref>). The DIRECT connection (db.<project-ref>.supabase.co)
  # is IPv6-only and does not work from an IPv4 cluster. The transaction pooler
  # on port 6543 works too, but is meant for short-lived connections; the session
  # pooler suits a long-running service. Add sslmode=require.
  #
  # WARNING: never point this at a database another gridstatic stack is already
  # using. Its active grid_configs are there; this bot will recognise them as its
  # own and manage the same grids. Two bots on one grid means duplicate orders.
  existingSecret: ""

hyperliquid:
  testnet: true
  # Optional. Name of a Secret with the keys `private_key` and `wallet_address`.
  # Leaving it empty is fine: without a key the connector never builds an exchange
  # client and its order routes answer 503. That is enough for shadow, which never
  # places an order. A grid with shadow: false needs it.
  existingSecret: ""

telegram:
  # Off: no alerter pod is deployed, and alert calls fail silently.
  enabled: false
  # Required once enabled is true. Name of a Secret with `bot_token` and `chat_id`.
  existingSecret: ""

grid:
  strategyAllocationPct: 80
  # Basis for order sizing -- live as well, not only in shadow. Set it to the
  # amount you are willing to trust this stack with. With 20 lines and 80%
  # allocation, 1000 means $40 per line.
  startBalance: 1000
  fillsPollIntervalSeconds: 30
  healthCheckIntervalSeconds: 60
  # The key is a free-form label that only shows up in log lines. Behaviour comes
  # from the fields below it.
  coins:
    BTC-20:
      coin: BTC
      active: true
      # shadow: false means trading with real money. Together with a filled-in
      # hyperliquid.existingSecret these are the two steps to going live, kept
      # deliberately separate.
      shadow: true
      allocationPct: 100
      upper: 83000
      lower: 75000
      numLines: 20
      leverage: 1

scheduling:
  # Empty: the scheduler picks a node. The images are built for amd64 and arm64.
  nodeSelector: {}
  tolerations: []

resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 200m
