apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-connector
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .Release.Name }}-connector }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-connector }
    spec:
      nodeSelector: {{ toYaml .Values.scheduling.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.scheduling.tolerations | nindent 8 }}
      containers:
        - name: connector
          image: "{{ .Values.images.connector.repository }}:{{ .Values.images.connector.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: HYPERLIQUID_TESTNET
              value: {{ .Values.hyperliquid.testnet | quote }}
            # HIP-3 dexes the grids trade on, from coins named "dex:NAME" such as
            # xyz:XYZ100. The SDK needs them to turn those names into asset ids.
            {{- $dexes := list }}
            {{- range $key, $c := .Values.grid.coins }}
            {{- if contains ":" (toString $c.coin) }}
            {{- $dexes = append $dexes (first (splitList ":" (toString $c.coin))) }}
            {{- end }}
            {{- end }}
            - name: HYPERLIQUID_PERP_DEXS
              value: {{ $dexes | uniq | sortAlpha | join "," | quote }}
            - name: HL_PRIVATE_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "gridstatic.hyperliquidSecret" . }}, key: private_key }
            - name: WALLET_ADDRESS
              valueFrom:
                secretKeyRef: { name: {{ include "gridstatic.hyperliquidSecret" . }}, key: wallet_address }
          readinessProbe:
            # Without this probe a pod counts as ready as soon as its container runs,
            # even while the application is still starting. For grid-static that is
            # plainly wrong: it first waits for the connector.
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources: {{ toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-connector
spec:
  selector: { app: {{ .Release.Name }}-connector }
  ports:
    - port: 8080
      targetPort: 8080
