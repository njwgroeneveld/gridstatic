apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-connector
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .Release.Name }}-connector }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-connector }
    spec:
      nodeSelector: {{ toYaml .Values.scheduling.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.scheduling.tolerations | nindent 8 }}
      containers:
        - name: connector
          image: "{{ .Values.images.connector.repository }}:{{ .Values.images.connector.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: HYPERLIQUID_TESTNET
              value: {{ .Values.hyperliquid.testnet | quote }}
            {{- if .Values.hyperliquid.existingSecret }}
            - name: HL_PRIVATE_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.hyperliquid.existingSecret }}, key: private_key }
            - name: WALLET_ADDRESS
              valueFrom:
                secretKeyRef: { name: {{ .Values.hyperliquid.existingSecret }}, key: wallet_address }
            {{- else }}
            # No key configured. The connector only builds its exchange client on the
            # first order call, so it starts normally: order routes answer 503 while
            # the info routes keep working through the public API. Enough for shadow,
            # not enough for a grid with shadow: false.
            {{- end }}
          readinessProbe:
            # Without this probe a pod counts as ready as soon as its container runs,
            # even while the application is still starting. For grid-static that is
            # plainly wrong: it first waits for the connector and the dal.
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources: {{ toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-connector
spec:
  selector: { app: {{ .Release.Name }}-connector }
  ports:
    - port: 8080
      targetPort: 8080
