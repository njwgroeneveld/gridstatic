apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
type: Opaque
stringData:
  url: {{ include "gridstatic.databaseUrl" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-hyperliquid
type: Opaque
stringData:
  private_key: {{ .Values.hyperliquid.privateKey | quote }}
  wallet_address: {{ .Values.hyperliquid.walletAddress | quote }}
{{- if .Values.telegram.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-telegram
type: Opaque
stringData:
  bot_token: {{ .Values.telegram.botToken | quote }}
  chat_id: {{ .Values.telegram.chatId | quote }}
{{- end }}
