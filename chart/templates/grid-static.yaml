apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-grid-static
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two pods managing the same grid would place
  # duplicate orders.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: {{ .Release.Name }}-grid-static }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-grid-static }
      annotations:
        # Without this checksum the deployment does not change when you only edit the
        # grids, and the running pod keeps the old settings.yaml.
        checksum/settings: {{ include (print $.Template.BasePath "/configmap-settings.yaml") . | sha256sum }}
    spec:
      nodeSelector: {{ toYaml .Values.scheduling.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.scheduling.tolerations | nindent 8 }}
      containers:
        - name: grid-static
          image: "{{ .Values.images.gridStatic.repository }}:{{ .Values.images.gridStatic.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 8080
          readinessProbe:
            # Without this probe a pod counts as ready as soon as its container runs,
            # even while the application is still starting. For grid-static that is
            # plainly wrong: it first waits for the connector and the dal.
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: settings
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: settings
          configMap:
            name: {{ .Release.Name }}-settings
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-grid-static
spec:
  selector: { app: {{ .Release.Name }}-grid-static }
  ports:
    - port: 8080
      targetPort: 8080
