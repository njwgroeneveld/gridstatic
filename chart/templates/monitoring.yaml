{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-grid-static
  {{- with .Values.monitoring.serviceMonitor.labels }}
  labels: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels: { app: {{ .Release.Name }}-grid-static }
  endpoints:
    - port: http
      # /metrics answers with a redirect to /metrics/; ask for the target directly.
      path: /metrics/
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
---
# The connector: the only service that talks to Hyperliquid, so the one that
# can say how long the exchange takes to answer.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-connector
  {{- with .Values.monitoring.serviceMonitor.labels }}
  labels: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels: { app: {{ .Release.Name }}-connector }
  endpoints:
    - port: http
      path: /metrics/
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
{{- if .Values.monitoring.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  {{- with .Values.monitoring.prometheusRule.labels }}
  labels: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: gridstatic
      rules:
        - alert: GridstaticDown
          # absent(), not up == 0: a pod that is gone takes its scrape target
          # with it, and then there is no `up` series left to be 0.
          expr: absent(up{namespace="{{ .Release.Namespace }}", job="{{ .Release.Name }}-grid-static"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "gridstatic is down in {{ .Release.Namespace }}"
            description: "No healthy grid-static target for 5 minutes. No round runs: no new sells and no buys. The stops on the exchange still protect the positions."
            runbook_url: "https://github.com/njwgroeneveld/gridstatic/blob/master/docs/operations.md#gridstaticdown"
        - alert: GridstaticHold
          # One alert per grid. A hold of a few rounds, right after a fill, is normal.
          expr: max by (namespace, coin) (grid_on_hold{namespace="{{ .Release.Namespace }}"}) == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            # {{`{{ $labels.coin }}`}} is filled in by Prometheus when the alert fires;
            # the backquotes keep Helm from reading it as its own template.
            summary: "{{`{{ $labels.coin }}`}} is on hold: no new buys"
            description: "The position of {{`{{ $labels.coin }}`}} has not added up for 30 minutes. The reason is in the bot's log and in /status."
            runbook_url: "https://github.com/njwgroeneveld/gridstatic/blob/master/docs/operations.md#gridstatichold"
{{- end }}
{{- if .Values.monitoring.grafanaDashboard.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard
  {{- with .Values.monitoring.grafanaDashboard.labels }}
  labels: {{ toYaml . | nindent 4 }}
  {{- end }}
data:
  gridstatic.json: |-
{{ .Files.Get "files/dashboard.json" | indent 4 }}
{{- end }}
