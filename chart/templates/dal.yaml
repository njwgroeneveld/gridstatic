apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dal
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .Release.Name }}-dal }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-dal }
      annotations:
        checksum/schema: {{ include (print $.Template.BasePath "/configmap-schema.yaml") . | sha256sum }}
    spec:
      nodeSelector: {{ toYaml .Values.scheduling.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.scheduling.tolerations | nindent 8 }}
      initContainers:
        # The schema is applied here and not in a Helm hook: a pre-install hook runs
        # before the regular resources -- including the Secret with the connection
        # string -- and Helm waits for it, so it deadlocks. The dal is the only service
        # that touches the database, so the wait belongs here. The script is
        # idempotent, so running it on every restart is harmless.
        - name: schema
          image: postgres:16-alpine
          env:
            - name: PGURL
              valueFrom:
                secretKeyRef: { name: {{ include "gridstatic.databaseSecret" . }}, key: url }
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -d "$PGURL" -t 3; do
                echo "waiting for the database..."
                sleep 3
              done
              psql "$PGURL" -v ON_ERROR_STOP=1 -f /sql/schema.sql
          volumeMounts:
            - name: schema
              mountPath: /sql
      containers:
        - name: dal
          image: "{{ .Values.images.dal.repository }}:{{ .Values.images.dal.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ include "gridstatic.databaseSecret" . }}, key: url }
          readinessProbe:
            # Without this probe a pod counts as ready as soon as its container runs,
            # even while the application is still starting. For grid-static that is
            # plainly wrong: it first waits for the connector and the dal.
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: schema
          configMap:
            name: {{ .Release.Name }}-schema
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dal
spec:
  selector: { app: {{ .Release.Name }}-dal }
  ports:
    - port: 8080
      targetPort: 8080
