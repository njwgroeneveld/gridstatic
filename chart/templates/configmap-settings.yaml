{{- /* Grids that are all switched off are fine: the stack runs and trades nothing
     until one is set to active. No grid at all is a values file never filled in. */ -}}
{{- if not .Values.grid.coins }}
{{- fail "grid.coins is empty. Add a grid to your values file -- chart/values.yaml has a commented example, and install.sh writes one for you. The chart has no default grid on purpose: Helm merges maps, so a default would quietly run next to yours." }}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-settings
data:
  settings.yaml: |
    connector_url: http://{{ .Release.Name }}-connector:8080
    alerter_url: http://{{ .Release.Name }}-alerter:8080

    coins:
    {{- range $key, $c := .Values.grid.coins }}
      {{ $key }}:
        coin: {{ $c.coin | quote }}
        active: {{ $c.active }}
        allocation_pct: {{ $c.allocationPct }}
        upper: {{ $c.upper }}
        lower: {{ $c.lower }}
        num_lines: {{ $c.numLines }}
        leverage: {{ $c.leverage | default 1 }}
        {{- if $c.stopLoss }}
        stop_loss: {{ $c.stopLoss }}
        {{- end }}
        {{- if $c.maxEquityUsd }}
        max_equity_usd: {{ $c.maxEquityUsd }}
        {{- end }}
    {{- end }}

    round_interval_seconds: {{ .Values.grid.roundIntervalSeconds }}
    fill_lookback_hours: {{ .Values.grid.fillLookbackHours }}
