{{- $active := 0 }}
{{- range $key, $c := .Values.grid.coins }}
{{- if $c.active }}{{ $active = add1 $active }}{{ end }}
{{- end }}
{{- if eq $active 0 }}
{{- fail "grid.coins has no active grid. Add one to your values file -- chart/values.yaml has a commented example. The chart has no default grid on purpose: Helm merges maps, so a default would quietly run next to yours." }}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-settings
data:
  settings.yaml: |
    connector_url: http://{{ .Release.Name }}-connector:8080
    alerter_url: http://{{ .Release.Name }}-alerter:8080

    coins:
    {{- range $key, $c := .Values.grid.coins }}
      {{ $key }}:
        coin: {{ $c.coin | quote }}
        active: {{ $c.active }}
        allocation_pct: {{ $c.allocationPct }}
        upper: {{ $c.upper }}
        lower: {{ $c.lower }}
        num_lines: {{ $c.numLines }}
        leverage: {{ $c.leverage | default 1 }}
        {{- if $c.stopLoss }}
        stop_loss: {{ $c.stopLoss }}
        {{- end }}
        {{- if $c.maxEquityUsd }}
        max_equity_usd: {{ $c.maxEquityUsd }}
        {{- end }}
    {{- end }}

    round_interval_seconds: {{ .Values.grid.roundIntervalSeconds }}
    fill_lookback_hours: {{ .Values.grid.fillLookbackHours }}
