{{- range $key, $c := .Values.grid.coins }}
{{- if $c.shadow }}
{{- fail (printf "grid %s has shadow: true, but shadow mode was removed in chart 0.4.0. Installing would place real orders for a grid you believe is simulated. Test on testnet instead (hyperliquid.testnet: true) and remove `shadow` from the grid." $key) }}
{{- end }}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-settings
data:
  settings.yaml: |
    connector_url: http://{{ .Release.Name }}-connector:8080
    alerter_url: http://{{ .Release.Name }}-alerter:8080

    strategy_allocation_pct: {{ .Values.grid.strategyAllocationPct }}
    start_balance: {{ .Values.grid.startBalance }}

    coins:
    {{- range $key, $c := .Values.grid.coins }}
      {{ $key }}:
        coin: {{ $c.coin }}
        active: {{ $c.active }}
        allocation_pct: {{ $c.allocationPct }}
        upper: {{ $c.upper }}
        lower: {{ $c.lower }}
        num_lines: {{ $c.numLines }}
        leverage: {{ $c.leverage }}
    {{- end }}

    round_interval_seconds: {{ .Values.grid.roundIntervalSeconds }}
    fill_lookback_hours: {{ .Values.grid.fillLookbackHours }}
