name: Deploy telegram-alerter

on:
  push:
    branches: [master]
    paths:
      - 'services/telegram-alerter/**'
      - '.github/workflows/deploy-telegram-alerter.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r services/telegram-alerter/requirements.txt
      - name: Run tests
        run: |
          PYTHONPATH=$GITHUB_WORKSPACE/services/telegram-alerter \
            python -m pytest services/telegram-alerter/tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/telegram-alerter
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/gridstatic-telegram-alerter:latest
            ghcr.io/${{ github.repository_owner }}/gridstatic-telegram-alerter:${{ github.sha }}
