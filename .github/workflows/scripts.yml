name: Scripts

on:
  push:
    branches: [master]
    paths:
      - '*.sh'
      - '.github/workflows/scripts.yml'
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck install.sh

      - name: install.sh dry run touches nothing
        env:
          GRIDSTATIC_HL_KEY: "0x1111111111111111111111111111111111111111111111111111111111111111"
        run: bash install.sh --dry-run

      - name: No key in the dry-run output
        env:
          GRIDSTATIC_HL_KEY: "0xabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdef1234"
        run: |
          if bash install.sh --dry-run 2>&1 | grep -qi abcdefabcdef; then
            echo "ERROR: the dry run prints the private key"
            exit 1
          fi

      - name: install.sh refuses something that is not a key
        env:
          GRIDSTATIC_HL_KEY: "not-a-key"
        run: |
          if bash install.sh --dry-run > /dev/null 2>&1; then
            echo "ERROR: install.sh accepted an invalid key"
            exit 1
          fi
