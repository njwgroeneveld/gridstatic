name: Scripts

on:
  push:
    branches: [master]
    paths:
      - '*.sh'
      - '.github/workflows/scripts.yml'
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck install.sh

      - name: install.sh dry run touches nothing
        env:
          GRIDSTATIC_DB_URL: postgresql://postgres.test:secret@aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
        run: bash install.sh --dry-run

      - name: No secret in the dry-run output
        env:
          GRIDSTATIC_DB_URL: postgresql://postgres.test:verysecretpassword@aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
        run: |
          if bash install.sh --dry-run | grep -q verysecretpassword; then
            echo "ERROR: the dry run prints the password"
            exit 1
          fi
