name: Scripts

on:
  push:
    branches: [master]
    paths:
      - '*.sh'
      - '.github/workflows/scripts.yml'
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck install.sh

      - name: install.sh draait droog zonder iets aan te raken
        env:
          GRIDSTATIC_DB_URL: postgresql://postgres.test:geheim@aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
        run: bash install.sh --dry-run

      - name: Geen geheim in de dry-run-uitvoer
        env:
          GRIDSTATIC_DB_URL: postgresql://postgres.test:zeergeheimwachtwoord@aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
        run: |
          if bash install.sh --dry-run | grep -q zeergeheimwachtwoord; then
            echo "FOUT: de dry-run toont het wachtwoord"
            exit 1
          fi
