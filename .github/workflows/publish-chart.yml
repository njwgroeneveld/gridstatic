name: Publish chart

on:
  push:
    branches: [master]
    paths:
      - 'chart/**'
      - '.github/workflows/publish-chart.yml'
  workflow_dispatch:

jobs:
  lint-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      KEY: --set hyperliquid.existingSecret=test-hl-secret
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint ./chart $KEY

      - name: Render
        run: helm template t ./chart $KEY > /dev/null

      - name: Refuse to render without hyperliquid.existingSecret
        run: |
          # Check the reason too: a template that breaks for some other reason
          # would pass a bare "does it fail" check.
          if out=$(helm template t ./chart 2>&1); then
            echo "ERROR: the chart renders without hyperliquid.existingSecret"
            exit 1
          fi
          echo "$out" | grep -q "hyperliquid.existingSecret is empty"

      - name: Testnet by default
        run: |
          helm template t ./chart $KEY \
            | grep -A1 "name: HYPERLIQUID_TESTNET" | grep -q 'value: "true"'

      - name: Refuse a grid that still says shadow true
        run: |
          # Shadow mode is gone. Rendering it would place real orders for a grid
          # someone believes is simulated.
          if out=$(helm template t ./chart $KEY --set grid.coins.BTC-20.shadow=true 2>&1); then
            echo "ERROR: the chart renders a grid with shadow: true"
            exit 1
          fi
          echo "$out" | grep -q "shadow mode was removed"

      - name: No database left
        run: |
          if helm template t ./chart $KEY | grep -qiE -- "-dal\b|DATABASE_URL|dal_url"; then
            echo "ERROR: the rendered chart still refers to the dal or a database"
            exit 1
          fi

      - name: The chart creates no Secrets of its own
        run: |
          if helm template t ./chart $KEY | grep -q "^kind: Secret"; then
            echo "ERROR: the chart renders a Secret; secrets must not pass through Helm"
            exit 1
          fi

      - name: Login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package & push
        run: |
          helm package ./chart -d /tmp
          helm push /tmp/gridstatic-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
