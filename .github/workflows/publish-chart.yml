name: Publish chart

on:
  push:
    branches: [master]
    paths:
      - 'chart/**'
      - 'db/schema.sql'
      - '.github/workflows/publish-chart.yml'
  workflow_dispatch:

jobs:
  lint-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Schema in the chart matches the source
        run: diff db/schema.sql chart/files/schema.sql

      - name: Lint
        run: helm lint ./chart --set database.existingSecret=test-db-secret

      - name: Render
        run: helm template t ./chart --set database.existingSecret=test-db-secret > /dev/null

      - name: Refuse to render without database.existingSecret
        run: |
          if helm template t ./chart > /dev/null 2>&1; then
            echo "ERROR: the chart renders without database.existingSecret"
            exit 1
          fi

      - name: The schema is in the rendered ConfigMap
        run: |
          helm template t ./chart --set database.existingSecret=test-db-secret \
            | grep -q "CREATE UNIQUE INDEX IF NOT EXISTS grid_orders_one_open_buy_per_level"

      - name: Everything runs in shadow by default
        run: |
          # Comment lines in the templates mention "shadow: false" to explain what it
          # does. Only real settings count, so strip comments first.
          if helm template t ./chart --set database.existingSecret=test-db-secret | grep -v '^[[:space:]]*#' | grep -q "shadow: false"; then
            echo "ERROR: the default values put a grid on shadow: false"
            exit 1
          fi

      - name: The chart creates no Secrets of its own
        run: |
          if helm template t ./chart --set database.existingSecret=test-db-secret | grep -q "^kind: Secret"; then
            echo "ERROR: the chart renders a Secret; secrets must not pass through Helm"
            exit 1
          fi

      - name: Login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package & push
        run: |
          helm package ./chart -d /tmp
          helm push /tmp/gridstatic-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
