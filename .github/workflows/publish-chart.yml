name: Publish chart

on:
  push:
    branches: [master]
    paths:
      - 'chart/**'
      - 'db/schema.sql'
      - '.github/workflows/publish-chart.yml'
  workflow_dispatch:

jobs:
  lint-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Schema in de chart is gelijk aan de bron
        run: diff db/schema.sql chart/files/schema.sql

      - name: Lint
        run: helm lint ./chart --set database.existingSecret=test-db-secret

      - name: Render
        run: helm template t ./chart --set database.existingSecret=test-db-secret > /dev/null

      - name: Weiger een chart zonder database.existingSecret
        run: |
          if helm template t ./chart > /dev/null 2>&1; then
            echo "FOUT: de chart rendert zonder database.existingSecret"
            exit 1
          fi

      - name: Het schema zit in de gerenderde configmap
        run: |
          helm template t ./chart --set database.existingSecret=test-db-secret \
            | grep -q "CREATE UNIQUE INDEX IF NOT EXISTS grid_orders_one_open_buy_per_level"

      - name: Standaard draait alles in shadow
        run: |
          # Commentaarregels in de templates noemen "shadow: false" om uit te leggen
          # wat het doet. Alleen echte instellingen tellen, dus commentaar eruit.
          if helm template t ./chart --set database.existingSecret=test-db-secret | grep -v '^[[:space:]]*#' | grep -q "shadow: false"; then
            echo "FOUT: de meegeleverde waarden zetten een grid op shadow: false"
            exit 1
          fi

      - name: De chart maakt zelf geen Secrets aan
        run: |
          if helm template t ./chart --set database.existingSecret=test-db-secret | grep -q "^kind: Secret"; then
            echo "FOUT: de chart rendert een Secret; geheimen horen niet door Helm te lopen"
            exit 1
          fi

      - name: Login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package & push
        run: |
          helm package ./chart -d /tmp
          helm push /tmp/gridstatic-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
