name: Publish chart

on:
  push:
    branches: [master]
    paths:
      - 'chart/**'
      - 'gridstatic-values.example.yaml'
      - '.github/workflows/publish-chart.yml'
  workflow_dispatch:

jobs:
  lint-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      KEY: -f chart/ci/test-values.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint ./chart $KEY

      - name: Render
        run: helm template t ./chart $KEY > /dev/null

      - name: Refuse to render without hyperliquid.existingSecret
        run: |
          # Check the reason too: a template that breaks for some other reason
          # would pass a bare "does it fail" check.
          if out=$(helm template t ./chart $KEY --set hyperliquid.existingSecret= 2>&1); then
            echo "ERROR: the chart renders without hyperliquid.existingSecret"
            exit 1
          fi
          echo "$out" | grep -q "hyperliquid.existingSecret is empty"

      - name: Refuse to render without any grid
        run: |
          # No default grid on purpose: Helm merges maps, so a default would run
          # next to the user's own grids without them knowing.
          if out=$(helm template t ./chart --set hyperliquid.existingSecret=x 2>&1); then
            echo "ERROR: the chart renders without any grid"
            exit 1
          fi
          echo "$out" | grep -q "grid.coins is empty"

      - name: The example values render, every grid switched off
        run: |
          # What install.sh writes: the stack runs, nothing trades until a grid is activated.
          helm template t ./chart -f gridstatic-values.example.yaml > /tmp/out.yaml
          if grep -q "active: true" /tmp/out.yaml; then
            echo "ERROR: the example values switch a grid on"
            exit 1
          fi

      - name: The HIP-3 dex reaches the connector
        run: |
          helm template t ./chart $KEY --set grid.coins.NDX.coin=xyz:XYZ100             --set grid.coins.NDX.active=true --set grid.coins.NDX.allocationPct=100             --set grid.coins.NDX.upper=32000 --set grid.coins.NDX.lower=29000             --set grid.coins.NDX.numLines=20 --set grid.coins.NDX.leverage=1             | grep -A1 "name: HYPERLIQUID_PERP_DEXS" | grep -q 'value: "xyz"'

      - name: Testnet by default
        run: |
          helm template t ./chart $KEY \
            | grep -A1 "name: HYPERLIQUID_TESTNET" | grep -q 'value: "true"'

      - name: No database left
        run: |
          if helm template t ./chart $KEY | grep -qiE -- "-dal\b|DATABASE_URL|dal_url"; then
            echo "ERROR: the rendered chart still refers to the dal or a database"
            exit 1
          fi

      - name: helm uninstall cancels the grid's orders by default
        run: |
          helm template t ./chart $KEY --show-only templates/uninstall-hook.yaml \
            | grep -q '"helm.sh/hook": pre-delete'

      - name: The chart creates no Secrets of its own
        run: |
          if helm template t ./chart $KEY | grep -q "^kind: Secret"; then
            echo "ERROR: the chart renders a Secret; secrets must not pass through Helm"
            exit 1
          fi

      - name: Login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package & push
        run: |
          helm package ./chart -d /tmp
          helm push /tmp/gridstatic-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
